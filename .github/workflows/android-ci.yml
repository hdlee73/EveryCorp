name: Android CI

on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle/**", ".github/workflows/android-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # 단위 테스트와 디버그 빌드는 Secrets 없이 동작한다(포크 PR에서도 안전).
      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report
          path: app/build/reports/tests/
