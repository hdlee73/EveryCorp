name: Test APK

# 브랜치의 변경을 휴대폰에서 시험해 보려고 서명 APK 를 미리 만든다. 레포 쓰기 권한자가 Actions 에서 직접 실행할 때만 동작한다.
# GitHub 릴리스로는 "사전 릴리스(pre-release)"로만 올리므로 앱의 자동 업데이트(releases/latest)에는 잡히지 않는다.
# 서명키·API 토큰은 Secrets 에서만 읽는다(PR·포크 워크플로에는 전달되지 않는다).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-apk:
    if: github.repository == 'hdlee73/EveryCorp' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 없어 중단합니다."
            exit 1
          fi

      - name: Restore keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: ./gradlew assembleRelease

      - name: Prepare files
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "TAG=test-v$VERSION-$SHORT" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "everycorp-test-v$VERSION-$SHORT.apk"

      - name: Verify APK is signed
        run: |
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs everycorp-test-v*.apk | head -3

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" everycorp-test-v*.apk --prerelease --target "$GITHUB_SHA" \
            --title "테스트 APK v$VERSION ($GITHUB_REF_NAME)" \
            --notes "브랜치 $GITHUB_REF_NAME 의 시험용 빌드입니다. 정식 릴리스가 아니며 자동 업데이트 대상이 아닙니다."

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
