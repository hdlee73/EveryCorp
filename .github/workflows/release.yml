name: Release APK

# main 에 push(= 레포 쓰기 권한자만 가능)되었을 때만 서명 APK 를 만들고 GitHub Release 로 게시한다.
# 서명키·비밀번호는 GitHub Secrets 에만 있고, 포크/PR 워크플로에는 전달되지 않는다.
on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "RELEASE_NOTES.md", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'hdlee73/EveryCorp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 없어 릴리스를 중단합니다. docs/SETUP_CHECKLIST.md 를 따라 등록해 주세요."
            exit 1
          fi

      - name: Restore keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: ./gradlew assembleRelease

      - name: Prepare release files
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "everycorp-v$VERSION.apk"
          sha256sum "everycorp-v$VERSION.apk" > "everycorp-v$VERSION.apk.sha256"

      - name: Verify APK is signed
        run: |
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "everycorp-v$VERSION.apk" | head -3

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --notes-file RELEASE_NOTES.md
            gh release upload "v$VERSION" "everycorp-v$VERSION.apk" "everycorp-v$VERSION.apk.sha256" --clobber
          else
            gh release create "v$VERSION" "everycorp-v$VERSION.apk" "everycorp-v$VERSION.apk.sha256" \
              --target "$GITHUB_SHA" --title "EveryCorp v$VERSION" --notes-file RELEASE_NOTES.md
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
